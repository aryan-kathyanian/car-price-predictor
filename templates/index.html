<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <h1>Car Price Predictor</h1>
            <p>Enter details to estimate your car's price</p>

            <form id="priceForm">
                <label for="company">Company</label>
                <select id="company" name="company" required>
                    {% for company in companies %}
                        <option value="{{ company }}">{{ company }}</option>
                    {% endfor %}
                </select>

                <label for="car_model">Model</label>
                <select id="car_model" name="car_models" required>
                    <option selected disabled>-- Select Company First --</option>
                </select>

                <label for="year">Year</label>
                <select id="year" name="year" required>
                    {% for y in years %}
                        <option value="{{ y }}">{{ y }}</option>
                    {% endfor %}
                </select>

                <label for="fuel_type">Fuel Type</label>
                <select id="fuel_type" name="fuel_type" required>
                    {% for f in fuel_types %}
                        <option value="{{ f }}">{{ f }}</option>
                    {% endfor %}
                </select>

                <label for="kilo_driven">Kilometers Driven</label>
                <input type="number" id="kilo_driven" name="kilo_driven" placeholder="e.g. 45000" required>

                <button type="submit">Predict Price</button>
            </form>

            <div class="result" id="prediction"></div>
        </div>
    </div>

    <script>
        const carDataURL = '/get_car_models';

        document.getElementById('company').addEventListener('change', function () {
            const company = this.value;
            const modelSelect = document.getElementById('car_model');
            modelSelect.innerHTML = '<option selected disabled>Loading models...</option>';

            fetch(carDataURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company: company })
            })
            .then(res => res.json())
            .then(data => {
                modelSelect.innerHTML = '<option selected disabled>-- Select Model --</option>';
                data.models.forEach(model => {
                    const opt = document.createElement('option');
                    opt.value = model;
                    opt.textContent = model;
                    modelSelect.appendChild(opt);
                });
            });
        });

        document.getElementById('priceForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            document.getElementById('prediction').textContent = "⏳ Predicting...";
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(res => res.text())
            .then(price => {
                document.getElementById('prediction').textContent = `Estimated Price: ₹ ${price}`;
            });
        });
    </script>
</body>
</html>
